server {
    listen 80;
    server_name localhost;

    # Basic Authentication
    auth_basic "Skills Matrix - Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # We sit behind a Cloudflare tunnel that terminates TLS upstream of us.
    # Without this, nginx rewrites relative redirects (e.g. /welcome.html) to
    # absolute http://… URLs based on the inbound non-TLS request, which would
    # bounce the client from https → http on every 302.
    absolute_redirect off;

    # Root directory for static files
    root /usr/share/nginx/html;
    index index.html;

    # Public sign-out landing page (no auth required)
    location = /welcome.html {
        auth_basic off;
    }
    location = /welcome {
        auth_basic off;
        try_files /welcome.html =404;
    }

    # Public "you cancelled the prompt" page that /signin substitutes in
    # on auth failure (status stays 401 so WWW-Authenticate still fires).
    location = /signin-failed.html {
        auth_basic off;
    }

    # Explicit sign-in path. Requires auth — this is the only path that
    # surfaces the native Basic Auth dialog. We serve a tiny static page
    # (signin.html) because `return 302` runs before nginx's auth phase,
    # which would otherwise let users skip the challenge. The page itself
    # immediately redirects to /.
    #
    # Distinct realm name so the browser treats this as a fresh credential
    # request even if the user previously cancelled the prompt on /.
    # On 401, substitute a styled retry page (body only — status and
    # WWW-Authenticate header remain so the dialog still pops).
    location = /signin {
        auth_basic "Skills Matrix - Sign In";
        auth_basic_user_file /etc/nginx/.htpasswd;
        error_page 401 /signin-failed.html;
        try_files /signin.html =404;
    }

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Serve static files. Unauthenticated visitors are redirected to the
    # public welcome page rather than seeing a raw 401 or the bare auth
    # dialog without any branding/context.
    location / {
        error_page 401 = @public_landing;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location @public_landing {
        return 302 /welcome.html;
    }

    # Health check only — the Docker HEALTHCHECK (and any uptime probe)
    # depends on this staying public. Everything else under /api/ is authed.
    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy API requests to Node.js backend. Inherits the server-level
    # basic auth — anonymous API access was issue #4/#11.
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }

    # Admin endpoints — re-require basic auth at the proxy layer too
    # (defence in depth; the Express layer also checks).
    location /api/admin/ {
        auth_basic "Skills Matrix - Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:3000/api/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Settings endpoints mutate API keys and feature flags — re-require
    # basic auth at the proxy layer too, same as /api/admin/ (defence in
    # depth; the Express layer also checks).
    location /api/settings/ {
        auth_basic "Skills Matrix - Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:3000/api/settings/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Cache images and fonts (not JS/CSS to allow version updates)
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # JS and CSS files - allow versioning with query strings
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
