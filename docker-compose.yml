version: '3.8'

services:
  skills-matrix-db:
    image: skills-matrix:latest
    container_name: skills-matrix-db
    restart: unless-stopped
    networks:
      - net_core
    ports:
      - "8098:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

networks:
  net_core:
    external: true
