<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Team Skills Matrix — Sign in cancelled</title>
    <style>
        :root {
            --bg-main: #23272a; --bg-card: #2b2f33;
            --accent: #00a3ff; --accent-2: #00d1ff;
            --text-primary: #ffffff; --text-secondary: #a0aec0;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: rgba(0, 0, 0, 0.4);
        }
        @media (prefers-color-scheme: light) {
            :root {
                --bg-main: #f0f4f8; --bg-card: #ffffff;
                --text-primary: #1a1c1e; --text-secondary: #4a5568;
                --border: #e2e8f0; --shadow: rgba(0, 0, 0, 0.08);
            }
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; padding: 0; height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            display: flex; align-items: center; justify-content: center;
            line-height: 1.6;
        }
        .panel {
            max-width: 520px; width: 90%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 3rem 2.5rem;
            box-shadow: 0 12px 40px var(--shadow);
            text-align: center;
        }
        .panel h1 { margin: 0 0 0.5rem; font-size: 1.75rem; }
        .panel .lead { color: var(--text-secondary); margin: 0 0 1.75rem; }
        .panel .icon { font-size: 2.75rem; margin-bottom: 1rem; }
        .actions { display: flex; gap: 0.75rem; justify-content: center; }
        .btn {
            font-size: 1rem; padding: 0.7rem 1.6rem;
            border-radius: 8px; cursor: pointer; font-weight: 600;
            transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
            border: 1px solid var(--accent);
        }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-2); box-shadow: 0 0 14px rgba(0, 163, 255, 0.4); }
        .btn-primary:active { transform: translateY(1px); }
        .btn-secondary { background: transparent; color: var(--text-primary); border-color: var(--border); }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }
        .hint {
            color: var(--text-secondary); font-size: 0.8rem;
            margin-top: 1.5rem; font-style: italic;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="icon">🔐</div>
        <h1>Sign in cancelled</h1>
        <p class="lead">
            You closed the sign-in prompt or entered the wrong credentials.<br>
            Click <strong>Try again</strong> to re-open the prompt.
        </p>
        <div class="actions">
            <button class="btn btn-primary" id="retryBtn">Try again</button>
            <a class="btn btn-secondary" href="/welcome.html">Back to landing</a>
        </div>
        <p class="hint">
            If "Try again" doesn't show a prompt, your browser may have suppressed it —
            refresh the page or open a new private window.
        </p>
    </div>
    <script>
        document.getElementById('retryBtn').addEventListener('click', () => {
            // Force a fresh request so the browser re-issues the auth prompt.
            window.location.href = '/signin?retry=' + Date.now();
        });
    </script>
</body>
</html>
